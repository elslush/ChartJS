<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ChartJS Widget Demo — All 10 Chart Types</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.7.2/Chart.bundle.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #f4f6f9; padding: 24px; }
  h1 { text-align: center; margin-bottom: 24px; color: #333; font-size: 22px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: 1100px; margin: 0 auto; }
  .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 20px; }
  .card h2 { font-size: 15px; color: #555; margin-bottom: 12px; text-align: center; }
  .card canvas { width: 100% !important; height: 280px !important; }
  .full-width { grid-column: 1 / -1; }
</style>
</head>
<body>
<h1>ChartJS Mendix Widget — All 10 Chart Types (Chart.js 2.7.2)</h1>
<div class="grid">

  <!-- 1. Bar Chart -->
  <div class="card">
    <h2>Bar Chart</h2>
    <canvas id="barChart"></canvas>
  </div>

  <!-- 2. Horizontal Bar Chart -->
  <div class="card">
    <h2>Horizontal Bar Chart</h2>
    <canvas id="horizontalBarChart"></canvas>
  </div>

  <!-- 3. Stacked Bar Chart -->
  <div class="card">
    <h2>Stacked Bar Chart</h2>
    <canvas id="stackedBarChart"></canvas>
  </div>

  <!-- 4. Line Chart -->
  <div class="card">
    <h2>Line Chart</h2>
    <canvas id="lineChart"></canvas>
  </div>

  <!-- 5. Pie Chart / Doughnut Chart -->
  <div class="card">
    <h2>Pie Chart</h2>
    <canvas id="pieChart"></canvas>
  </div>

  <div class="card">
    <h2>Doughnut Chart</h2>
    <canvas id="doughnutChart"></canvas>
  </div>

  <!-- 6. Polar Chart -->
  <div class="card">
    <h2>Polar Area Chart</h2>
    <canvas id="polarChart"></canvas>
  </div>

  <!-- 7. Radar Chart -->
  <div class="card">
    <h2>Radar Chart</h2>
    <canvas id="radarChart"></canvas>
  </div>

  <!-- 8. Scatter Chart -->
  <div class="card">
    <h2>Scatter Chart</h2>
    <canvas id="scatterChart"></canvas>
  </div>

  <!-- 9. Bubble Chart -->
  <div class="card">
    <h2>Bubble Chart</h2>
    <canvas id="bubbleChart"></canvas>
  </div>

  <!-- 10. Gantt Chart -->
  <div class="card full-width">
    <h2>Gantt Chart (Simulated)</h2>
    <canvas id="ganttChart"></canvas>
  </div>

</div>

<script>
// Sample data palette
const colors = ['#3498db', '#e74c3c', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c'];
const labels = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];

const commonOpts = {
  responsive: true,
  maintainAspectRatio: false,
  title: { display: false },
  tooltips: { enabled: true },
  animation: { duration: 800 },
};

// ── 1. Bar Chart ──
new Chart(document.getElementById('barChart').getContext('2d'), {
  type: 'bar',
  data: {
    labels: labels,
    datasets: [
      { label: 'Revenue', backgroundColor: '#3498db', data: [12, 19, 8, 15, 12, 17] },
      { label: 'Expenses', backgroundColor: '#e74c3c', data: [7, 11, 5, 8, 9, 12] },
    ],
  },
  options: Object.assign({}, commonOpts, {
    title: { display: true, text: 'Monthly Revenue vs Expenses' },
    scales: {
      yAxes: [{ ticks: { beginAtZero: true } }],
    },
  }),
});

// ── 2. Horizontal Bar Chart ──
new Chart(document.getElementById('horizontalBarChart').getContext('2d'), {
  type: 'horizontalBar',
  data: {
    labels: ['Engineering', 'Marketing', 'Sales', 'Support', 'HR'],
    datasets: [{
      label: 'Headcount',
      backgroundColor: colors.slice(0, 5),
      data: [42, 18, 25, 14, 8],
    }],
  },
  options: Object.assign({}, commonOpts, {
    title: { display: true, text: 'Department Headcount' },
    scales: {
      xAxes: [{ ticks: { beginAtZero: true } }],
    },
  }),
});

// ── 3. Stacked Bar Chart ──
new Chart(document.getElementById('stackedBarChart').getContext('2d'), {
  type: 'bar',
  data: {
    labels: labels,
    datasets: [
      { label: 'Product A', backgroundColor: '#3498db', data: [10, 15, 12, 18, 14, 20] },
      { label: 'Product B', backgroundColor: '#2ecc71', data: [8, 10, 14, 12, 16, 11] },
      { label: 'Product C', backgroundColor: '#f39c12', data: [5, 8, 6, 9, 7, 10] },
    ],
  },
  options: Object.assign({}, commonOpts, {
    title: { display: true, text: 'Stacked Product Sales' },
    scales: {
      xAxes: [{ stacked: true }],
      yAxes: [{ stacked: true, ticks: { beginAtZero: true } }],
    },
  }),
});

// ── 4. Line Chart ──
new Chart(document.getElementById('lineChart').getContext('2d'), {
  type: 'line',
  data: {
    labels: labels,
    datasets: [
      {
        label: 'Users',
        borderColor: '#3498db',
        backgroundColor: 'rgba(52,152,219,0.15)',
        data: [120, 190, 170, 250, 220, 310],
        fill: true,
        lineTension: 0.3,
        pointRadius: 4,
      },
      {
        label: 'Sessions',
        borderColor: '#e74c3c',
        backgroundColor: 'rgba(231,76,60,0.1)',
        data: [200, 300, 280, 400, 380, 500],
        fill: true,
        lineTension: 0.3,
        pointRadius: 4,
      },
    ],
  },
  options: Object.assign({}, commonOpts, {
    title: { display: true, text: 'User Growth & Sessions' },
    scales: {
      yAxes: [{ ticks: { beginAtZero: true } }],
    },
  }),
});

// ── 5. Pie Chart ──
new Chart(document.getElementById('pieChart').getContext('2d'), {
  type: 'pie',
  data: {
    labels: ['Desktop', 'Mobile', 'Tablet'],
    datasets: [{
      backgroundColor: ['#3498db', '#e74c3c', '#2ecc71'],
      hoverBackgroundColor: ['#2980b9', '#c0392b', '#27ae60'],
      data: [55, 35, 10],
    }],
  },
  options: Object.assign({}, commonOpts, {
    title: { display: true, text: 'Traffic by Device' },
    cutoutPercentage: 0,
  }),
});

// ── 5b. Doughnut Chart ──
new Chart(document.getElementById('doughnutChart').getContext('2d'), {
  type: 'doughnut',
  data: {
    labels: ['Chrome', 'Firefox', 'Safari', 'Edge', 'Other'],
    datasets: [{
      backgroundColor: ['#3498db', '#e74c3c', '#2ecc71', '#f39c12', '#9b59b6'],
      hoverBackgroundColor: ['#2980b9', '#c0392b', '#27ae60', '#e67e22', '#8e44ad'],
      data: [62, 15, 12, 7, 4],
    }],
  },
  options: Object.assign({}, commonOpts, {
    title: { display: true, text: 'Browser Share' },
    cutoutPercentage: 50,
  }),
});

// ── 6. Polar Area Chart ──
new Chart(document.getElementById('polarChart').getContext('2d'), {
  type: 'polarArea',
  data: {
    labels: ['Speed', 'Reliability', 'Comfort', 'Safety', 'Efficiency'],
    datasets: [{
      backgroundColor: [
        'rgba(52,152,219,0.6)', 'rgba(231,76,60,0.6)', 'rgba(46,204,113,0.6)',
        'rgba(243,156,18,0.6)', 'rgba(155,89,182,0.6)',
      ],
      data: [80, 90, 70, 95, 85],
    }],
  },
  options: Object.assign({}, commonOpts, {
    title: { display: true, text: 'Vehicle Ratings' },
    scale: { ticks: { beginAtZero: true } },
  }),
});

// ── 7. Radar Chart ──
new Chart(document.getElementById('radarChart').getContext('2d'), {
  type: 'radar',
  data: {
    labels: ['Eating', 'Drinking', 'Sleeping', 'Working', 'Playing', 'Reading'],
    datasets: [
      {
        label: 'Alice',
        backgroundColor: 'rgba(52,152,219,0.2)',
        borderColor: '#3498db',
        pointBackgroundColor: '#3498db',
        data: [65, 59, 90, 81, 56, 72],
      },
      {
        label: 'Bob',
        backgroundColor: 'rgba(231,76,60,0.2)',
        borderColor: '#e74c3c',
        pointBackgroundColor: '#e74c3c',
        data: [28, 48, 40, 69, 86, 47],
      },
    ],
  },
  options: Object.assign({}, commonOpts, {
    title: { display: true, text: 'Lifestyle Comparison' },
    scale: {
      ticks: { beginAtZero: true, max: 100 },
    },
  }),
});

// ── 8. Scatter Chart ──
new Chart(document.getElementById('scatterChart').getContext('2d'), {
  type: 'scatter',
  data: {
    datasets: [
      {
        label: 'Group A',
        backgroundColor: 'rgba(52,152,219,0.6)',
        borderColor: '#3498db',
        data: [
          {x: 10, y: 20}, {x: 15, y: 10}, {x: 20, y: 30}, {x: 25, y: 15},
          {x: 30, y: 25}, {x: 35, y: 35}, {x: 40, y: 28}, {x: 45, y: 40},
        ],
        pointRadius: 6,
      },
      {
        label: 'Group B',
        backgroundColor: 'rgba(231,76,60,0.6)',
        borderColor: '#e74c3c',
        data: [
          {x: 12, y: 35}, {x: 18, y: 25}, {x: 22, y: 40}, {x: 28, y: 20},
          {x: 33, y: 30}, {x: 38, y: 18}, {x: 42, y: 45}, {x: 48, y: 32},
        ],
        pointRadius: 6,
      },
    ],
  },
  options: Object.assign({}, commonOpts, {
    title: { display: true, text: 'Scatter Plot — Two Groups' },
    scales: {
      xAxes: [{ type: 'linear', position: 'bottom', scaleLabel: { display: true, labelString: 'X Value' } }],
      yAxes: [{ scaleLabel: { display: true, labelString: 'Y Value' }, ticks: { beginAtZero: true } }],
    },
  }),
});

// ── 9. Bubble Chart ──
new Chart(document.getElementById('bubbleChart').getContext('2d'), {
  type: 'bubble',
  data: {
    datasets: [
      {
        label: 'Dataset 1',
        backgroundColor: 'rgba(46,204,113,0.5)',
        borderColor: '#2ecc71',
        data: [
          {x: 20, y: 30, r: 15}, {x: 40, y: 10, r: 10}, {x: 30, y: 22, r: 20},
          {x: 15, y: 40, r: 8}, {x: 50, y: 35, r: 12},
        ],
      },
      {
        label: 'Dataset 2',
        backgroundColor: 'rgba(155,89,182,0.5)',
        borderColor: '#9b59b6',
        data: [
          {x: 25, y: 15, r: 18}, {x: 35, y: 45, r: 7}, {x: 45, y: 20, r: 14},
          {x: 10, y: 25, r: 11}, {x: 55, y: 30, r: 9},
        ],
      },
    ],
  },
  options: Object.assign({}, commonOpts, {
    title: { display: true, text: 'Bubble Chart — Size Represents Magnitude' },
    scales: {
      xAxes: [{ type: 'linear', position: 'bottom', scaleLabel: { display: true, labelString: 'X' } }],
      yAxes: [{ scaleLabel: { display: true, labelString: 'Y' }, ticks: { beginAtZero: true } }],
    },
  }),
});

// ── 10. Gantt Chart (Simulated) ──
new Chart(document.getElementById('ganttChart').getContext('2d'), {
  type: 'horizontalBar',
  data: {
    labels: ['Research', 'Design', 'Development', 'Testing', 'Deployment', 'Marketing'],
    datasets: [
      {
        // Invisible offset bars
        label: '',
        data: [0, 3, 5, 12, 18, 15],
        backgroundColor: 'rgba(0,0,0,0)',
        hoverBackgroundColor: 'rgba(0,0,0,0)',
        borderWidth: 0,
      },
      {
        // Visible duration bars
        label: '',
        data: [5, 7, 10, 8, 4, 9],
        backgroundColor: ['#3498db', '#e74c3c', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c'],
        hoverBackgroundColor: ['#2980b9', '#c0392b', '#27ae60', '#e67e22', '#8e44ad', '#16a085'],
        borderWidth: 0,
      },
    ],
  },
  options: Object.assign({}, commonOpts, {
    title: { display: true, text: 'Project Gantt Chart — Task Timeline' },
    legend: { display: false },
    scales: {
      xAxes: [{
        stacked: true,
        scaleLabel: { display: true, labelString: 'Project Day' },
        ticks: { beginAtZero: true },
      }],
      yAxes: [{
        stacked: true,
        gridLines: { display: false },
      }],
    },
    tooltips: {
      callbacks: {
        label: function(tooltipItem) {
          if (tooltipItem.datasetIndex === 0) return null;
          var tasks = [
            {name:'Research',start:0,end:5}, {name:'Design',start:3,end:10},
            {name:'Development',start:5,end:15}, {name:'Testing',start:12,end:20},
            {name:'Deployment',start:18,end:22}, {name:'Marketing',start:15,end:24},
          ];
          var t = tasks[tooltipItem.index];
          return t.name + ': Day ' + t.start + ' → Day ' + t.end + ' (' + (t.end - t.start) + ' days)';
        },
      },
      filter: function(tooltipItem) { return tooltipItem.datasetIndex !== 0; },
    },
  }),
});
</script>
</body>
</html>
